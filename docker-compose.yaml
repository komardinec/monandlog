---
version: "3.8"

x-logging:
  &default-logging
  driver: "json-file"
  options:
    max-size: "1m"
    max-file: "1"
    tag: "{{.Name}}"

services:
  nginx:
    image: nginx:1.30.5-alpine
    container_name: nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./config/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./config/nginx/ssl-params.conf:/etc/nginx/snippets/ssl-params.conf
      - /etc/letsencrypt/live/komarufree.dpdns.org/fullchain.pem:/etc/nginx/ssl/certs/fullchain.pem
      - /etc/letsencrypt/live/komarufree.dpdns.org/privkey.pem:/etc/nginx/ssl/private/privkey.pem
      #- ./config/nginx/ssl/selfsigned.crt:/etc/nginx/ssl/certs/selfsigned.crt
      #- ./config/nginx/ssl/selfsigned.key:/etc/nginx/ssl/private/selfsigned.key
      - ./config/nginx/ssl/dhparam.pem:/etc/nginx/ssl/certs/dhparam.pem
      - ./config/nginx/.htpasswd:/etc/nginx/.htpasswd
    networks:
      - default
      - inter-web-shared
    dns:
      - 8.8.8.8
      - 8.8.4.4
      - 1.1.1.1
      - 1.0.0.1
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.15.0-rc.0
    container_name: prometheus
    ports:
      - "127.0.0.1:9090:9090"
    #expose:
    #  - 9323
    #  - 9090
    volumes:
      - ./config/prometheus:/config
      - prometheus-data:/prometheus
    restart: unless-stopped
    command: 
      - "--config.file=/config/prometheus.yml"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - node-exporter
      - cadvisor
      - alertmanager
    networks:
      - default
      - inter-web-shared
    logging: *default-logging
 
  alertmanager:
    image: prom/alertmanager@sha256:bfd89fca95f0a1f913a5a6a293ffea077272a6179c97f24d58073233f6f19b4d
    container_name: alertmanager
    volumes:
      - ./config/prometheus/alertmanager.yaml:/etc/alertmanager/alertmanager.yaml
    ports:
      - "127.0.0.1:9093:9093"
    restart: unless-stopped
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yaml"
      - "--web.route-prefix=/alertmanager/"

  grafana:
    image: grafana/grafana:13.0
    container_name: grafana
    ports:
      - "127.0.0.1:3000:3000"
    #expose:
    #  - 3000
    volumes:
      - grafana-data:/var/lib/grafana
      - grafana-frontend:/usr/share/grafana
    environment:
      - GF_SERVER_DOMAIN=komarufree.dpdns.org
      - GF_SERVER_ROOT_URL=%(protocol)s://%(domain)s:%(http_port)s/grafana/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
    restart: unless-stopped
    depends_on:
      - prometheus
      - loki
    logging: *default-logging

  node-exporter:
    image: quay.io/prometheus/node-exporter:v1.12.1
    container_name: node-exporter
    #ports:
    #  - "9100:9100"
    expose:
      - 9100
    command:
      - "--path.rootfs=/host"
      - "--collector.processes"
    pid: host
    restart: unless-stopped
    volumes:
      - "/:/host:ro,rslave"
    logging: *default-logging

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.55.1
    container_name: cadvisor
    privileged: true
    devices:
      - /dev/kmsg:/dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    #ports:
    #  - "8081:8080"
    expose:
      - 8080
    restart: unless-stopped
    logging: *default-logging

  loki:
    container_name: loki
    #user: loki
    image: grafana/loki:3.7.8
    #ports:
    #  - "3100:3100"
    expose:
      - 3100
    volumes: 
      - ./config/loki/loki-config.yaml:/etc/loki/loki-config.yaml
      - loki-data:/loki
    command: -config.file=/etc/loki/loki-config.yaml
    restart: unless-stopped
    depends_on:
      - promtail
    logging: *default-logging

  promtail:
    image: grafana/promtail:3.5.8
    container_name: promtail
    volumes:
      - ./config/promtail/promtail.yaml:/etc/promtail/promtail-config.yaml
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/log/journal:/var/log/journal:ro
      - /run/log/journal:/run/log/journal:ro
      - promtail-data:/tmp/positions
    command: -config.file=/etc/promtail/promtail-config.yaml
    #ports:
    #  - "9080:9080"
    expose:
      - 9080
    restart: unless-stopped
    logging: *default-logging

volumes:
  prometheus-data:
    driver: local
  grafana-data:
    driver: local
  grafana-frontend:
    driver: local
  promtail-data:
    driver: local
  loki-data:
    driver: local
    #driver_opts:
    #  o: bind

networks:
  inter-web-shared:
    external: true
    name: inter-web-shared
