---
version: "3.8"

services: 
  prometheus:
    image: prom/prometheus:v3.15.0-rc.0
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - /etc/prometheus:/config
      - prometheus-data:/prometheus
    restart: unless-stopped
    command: 
      - "--config.file=/config/prometheus.yml"
  #  extra_hosts:
  #    - "host.docker.internal:host-gateway"
  
  grafana:
    image: grafana/grafana:13.0
    container_name: grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    restart: unless-stopped

  #node-exporter:
  #  image: quay.io/prometheus/node-exporter:v1.12.1
  #  container_name: node-exporter
  #  ports:
  #    - "9100:9100"
  #  command:
  #    - '--path.rootfs=/host'
  #  pid: host
  #  restart: unless-stopped
  #  volumes:
  #    - '/:/host:ro,rslave'

volumes:
  prometheus-data:
    driver: local
  grafana-data:
    driver: local
