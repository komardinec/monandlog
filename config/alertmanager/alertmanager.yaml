global:
  resolve_timeout: 10m

templates:
  - "/etc/alertmanager/templates/*.tmpl"

route:
  group_by: ['alertname', 'instance', 'job']
  group_wait: 60s
  group_interval: 60s
  repeat_interval: 1h
  receiver: "main-alert-group"

receivers:
  - name: "main-alert-group"
