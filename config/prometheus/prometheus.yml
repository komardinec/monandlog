global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: nl-monitor-prometheus
    scrape_interval: 10s
    static_configs:
      - targets: ['localhost:9090']
  - job_name: nl-monitor-cadvisor
    scrape_interval: 10s
    static_configs:
      - targets: ['cadvisor:8080']
  - job_name: nl-monitor-promlab-demo
    scrape_interval: 10s
    static_configs:
      - targets: ['demo.promlabs.com:9090']
  - job_name: nl-monitor-node-exporter
    scrape_interval: 10s
    static_configs:
      - targets: ['node-exporter:9100']
  - job_name: nl-monitor-promtail
    scrape_interval: 10s
    static_configs:
      - targets: ['promtail:9080']
  - job_name: nl-monitor-loki
    scrape_interval: 10s
    metrics_path: /metrics
    static_configs:
      - targets: ['loki:3100']
  - job_name: nl-kwebserver
    scrape_interval: 10s
    metrics_path: /metrics
    static_configs:
      - targets: ['kwebserver:2112']
