global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "alert_rules.yaml"
  - "recording_rules.yaml"

alerting:
  alertmanagers:
    - path_prefix: "/alertmanager/"
      static_configs:
      - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: docker_containers
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 30s
    relabel_configs:
      - source_labels: [__meta_docker_container_label_prometheus_job]
        regex: .+
        action: keep
        target_label: job
      - source_labels: [__meta_docker_container_label_prometheus_scrape]
        action: keep
        regex: true

      - regex: __meta_docker_container_label_prometheus_(.+)
        action: labelmap
        replacement: $1
      
      - source_labels: [__meta_docker_container_label_prometheus_metrics_path]
        action: replace
        target_label: __metrics_path__
        regex: (.+)
      
      - source_labels: [__address__, __meta_docker_container_label_prometheus_metrics_port]
        action: replace
        regex: ([^:]+)(?::\d+)?;(\d+)
        replacement: $1:$2
        target_label: __address__
      #- source_labels: [__meta_docker_container_network_ip, __meta_docker_container_label_prometheus_metrics_port]
      #  action: replace
      #  regex: ([^:]+)(?::\d+)?;(\d+)
      #  replacement: $1:$2
      #  target_label: __address__
      #- source_labels: [__meta_docker_network_ip]
      #  target_label: container_ip
      #- source_labels: [__meta_docker_container_name]
      #  regex: "/(.+)"
      #  target_label: name
      
      #- source_labels: [__meta_docker_container_label_prometheus_job, __meta_docker_container_label_prometheus_metrics_port]
      #  action: replace
      #  regex: ([^:]+)(?::\d+)?;(\d+)
      #  replacement: $1:$2
      #  target_label: __address__

  - job_name: nl-monitor-prometheus
    scrape_interval: 10s
    metrics_path: /prometheus/metrics
    static_configs:
      - targets: ['localhost:9090']
  - job_name: nl-monitor-docker
    scrape_interval: 10s
    static_configs:
      - targets: ['host.docker.internal:9323']
