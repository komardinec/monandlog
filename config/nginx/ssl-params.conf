#from https://cipherli.st/
# and https://raymii.org/s/tutorials/Strong_SSL_Security_On_nginx.html

ssl_protocols TLSv1.1 TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers on;
ssl_ciphers "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256AES128-GCM-SHA";

ssl_ecdh_curve prime256v1:secp384r1;
ssl_stapling on;
ssl_stapling_verify on;
ssl_session_timeout 1h;
ssl_session_cache shared:SSL:10m;
ssl_session_tickets off;

resolver 127.0.0.11 8.8.8.8 8.8.4.4 valid=600s;
resolver_timeout 5s;

add_header Strict-Transport-Security 'max-age=63072000; includeSubDomains; preload' always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-XSS-Protection '0' always;
add_header Referrer-Policy 'strict-origin-when-cross-origin' always;


ssl_dhparam /etc/nginx/ssl/certs/dhparam.pem; 
ssl_certificate /etc/nginx/ssl/certs/fullchain.pem;
ssl_certificate_key /etc/nginx/ssl/private/privkey.pem;
