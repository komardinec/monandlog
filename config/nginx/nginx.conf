map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
}

#upstream grafana {
#        server http://grafana:3000;
#}

server {
        listen 80;
        listen [::]:80;

        server_name localhost komarufree.dpdns.org www.komarufree.dpdns.org;

        return 301 https://$host$request_uri;
}

server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name localhost komarufree.dpdns.org www.komarufree.dpdns.org;

        include snippets/ssl-params.conf;
        ssl_certificate /etc/nginx/ssl/certs/selfsigned.crt;
        ssl_certificate_key /etc/nginx/ssl/private/selfsigned.key;
        
        #resolver 127.0.0.11 valid=10s;
        #resolver_timeout 5s;

        location ^~ /grafana/ {
                rewrite ^/grafana/?(.*)$ /$1 break;
                #proxy_pass http://grafana:3000/;
                proxy_pass http://grafana:3000$request_uri;
           #return 301 http://$host:3000;
                proxy_set_header Host $http_host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
        }

        location ^~ /grafana/api/live/ {
                rewrite ^/grafana/?(.*)$ /$1 break;
                proxy_http_version 1.1;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection $connection_upgrade;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_pass http://grafana:3000$request_uri;
                #proxy_pass http://grafana;
        }

        location ^~ / {
                rewrite ^/?(.*)$ /$1 break;
                proxy_pass http://kwebserver:8443$request_uri;
                proxy_http_version 1.1;
                proxy_set_header Host $http_host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /version {
                default_type text/plain;
                return 200 "Iteration 20";
        }
}
