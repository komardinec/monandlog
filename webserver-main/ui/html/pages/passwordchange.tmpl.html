{{define "title"}}Password Change{{end}}

{{define "main"}}
<form action="/user/account/password/change" method="POST" novalidate>
    <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
    <div>
        <label>Current Password:</label>
        {{with .Form.FieldErrors.currentPassword}}
            <label class="error">{{.}}</label>
        {{end}}
        <input type="password" name="currentPassword" value="{{.Form.CurrentPassword}}">
    </div>
    <div>
        <label>New Password:</label>
        {{with .Form.FieldErrors.newPassword}}
            <label class="error">{{.}}</label>
        {{end}}
        <input type="password" name="newPassword">
    </div>
    <div>
        <label>Confirm new password:</label>
        {{with .Form.FieldErrors.confirmNewPassword}}
            <label class="error">{{.}}</label>
        {{end}}
        <input type="password" name="confirmNewPassword">
    </div>
    <div>
        <input type="submit" value="Submit">
    </div>
</form>
{{end}}
