{{define "title"}}Create a New File{{end}}

{{define "main"}}
<form action="/file/create" method="POST">
    <div>
        <label>Title</label>
        <input type="text" name="title">
    </div>
    <div>
        <label>Content</label>
        <textarea name="content"></textarea>
    </div>
    <div>
        <label>Expires in:</label>
        <input type="radio" name="expires" value="365" checked> 365 days
        <input type="radio" name="expires" value="7"> 7 days
        <input type="radio" name="expires" value="1"> 1 day
    </div>
    <div>
        <input type="submit" value="Submit">
    </div>
</form>
{{end}}
