{{define "title"}}Home{{end}}

{{define "main"}}
    <h2>Latest Files (DB entries)</h2>
    {{if .Files}}
        <table>
            <tr>
                <th>Title</th>
                <th>Created</th>
                <th>ID</th>
            <tr>
            {{range .Files}}
            <tr>
                <td><a href="/file/view/{{.ID}}">{{.Title}}</a></td>
                <td>{{NiceDate .Created}}</td>
                <td>#{{.ID}}</td>
            </tr>
            {{end}}
        </table>
        {{else}}
            <p>There's nothing here yet!</p>
        {{end}}
{{end}}
