{{define "title"}}User {{.User.Name}}#{{.User.ID}}{{end}}

{{define "main"}}
    <h2>Your Account</h2>
    {{with .User}}
    <table>
        <tr>
            <th>ID</th>
            <td>{{.ID}}</td>
        </tr>
        <tr>
            <th>Name</th>
            <td>{{.Name}}</td>
        </tr>
        <tr>
            <th>Email</th>
            <td>{{.Email}}</td>
        </tr>
        <tr>
            <th>Created</th>
            <td>{{NiceDate .Created}}</td>
        </tr>
        <tr>
            <th>Password</th>
            <td><a href="/user/account/password/change">Change here</a></td>
        </tr>
    </table>
    {{end}}
{{end}}
